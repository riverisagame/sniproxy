name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o "sniproxy-linux-${{ matrix.arch }}" ./cmd/sniproxy/

      - name: Checksum
        run: sha256sum "sniproxy-linux-${{ matrix.arch }}" > "sniproxy-linux-${{ matrix.arch }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sniproxy-linux-${{ matrix.arch }}
          path: sniproxy-linux-${{ matrix.arch }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
