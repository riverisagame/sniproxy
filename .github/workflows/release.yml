name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.pair.arch }}${{ matrix.pair.goamd64 && format('-{0}', matrix.pair.goamd64) }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pair:
          - arch: amd64
            goamd64: v1
          - arch: amd64
            goamd64: v2
          - arch: amd64
            goamd64: v3
          - arch: amd64
            goamd64: v4
          - arch: arm64
            goamd64: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.pair.arch }}
          GOAMD64: ${{ matrix.pair.goamd64 }}
          CGO_ENABLED: 0
        run: |
          SUFFIX="${{ matrix.pair.goamd64 }}"
          if [ -z "$SUFFIX" ]; then
            SUFFIX=""
          else
            SUFFIX="-$SUFFIX"
          fi
          go build -ldflags="-s -w" -o "sniproxy-linux-${{ matrix.pair.arch }}${SUFFIX}" ./cmd/sniproxy/

      - name: Checksum
        run: |
          SUFFIX="${{ matrix.pair.goamd64 }}"
          if [ -z "$SUFFIX" ]; then
            SUFFIX=""
          else
            SUFFIX="-$SUFFIX"
          fi
          sha256sum "sniproxy-linux-${{ matrix.pair.arch }}${SUFFIX}" > "sniproxy-linux-${{ matrix.pair.arch }}${SUFFIX}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: sniproxy-linux-${{ matrix.pair.arch }}${{ matrix.pair.goamd64 && format('-{0}', matrix.pair.goamd64) || '' }}
          path: sniproxy-linux-${{ matrix.pair.arch }}${{ matrix.pair.goamd64 && format('-{0}', matrix.pair.goamd64) || '' }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
